stages:
  - build
  - release

variables:
  PACKAGE_NAME: "cpr-agent"

# Build the module zip file
build:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache zip jq
  script:
    # Extract version from module.json
    - VERSION=$(jq -r '.version' module.json)
    - echo "Building version $VERSION"

    # Create a clean build directory
    - mkdir -p build/${PACKAGE_NAME}

    # Copy required files to build directory
    - cp -r dist build/${PACKAGE_NAME}/
    - cp module.json build/${PACKAGE_NAME}/
    - cp README.md build/${PACKAGE_NAME}/
    - cp LICENSE.md build/${PACKAGE_NAME}/

    # Create versioned zip file
    - cd build
    - zip -r ../${PACKAGE_NAME}-${VERSION}.zip ${PACKAGE_NAME}
    - cd ..

    # Also create the standard zip (for the download URL in module.json)
    - cp ${PACKAGE_NAME}-${VERSION}.zip ${PACKAGE_NAME}.zip

    # Output info
    - echo "Created ${PACKAGE_NAME}-${VERSION}.zip"
    - ls -la *.zip
  artifacts:
    name: "${PACKAGE_NAME}-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - "*.zip"
    expire_in: 1 week
  rules:
    # Run on tags (releases)
    - if: $CI_COMMIT_TAG
    # Run on main branch
    - if: $CI_COMMIT_BRANCH == "main"
    # Allow manual runs on other branches
    - if: $CI_COMMIT_BRANCH
      when: manual
      allow_failure: true

# Create a GitLab release when a tag is pushed
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: build
      artifacts: true
  script:
    - apk add --no-cache jq
    - VERSION=$(jq -r '.version' module.json)
    - echo "Creating release for version $VERSION"
  release:
    tag_name: $CI_COMMIT_TAG
    name: "Release $CI_COMMIT_TAG"
    description: |
      ## Cyberpunk Red Agent Bridge $CI_COMMIT_TAG

      ### Installation

      **Manifest URL:**
      ```
      https://gitlab.com/surrealtech/Cyberpunk-Red-Agent-Bridge/-/raw/main/module.json
      ```

      **Direct Download:**
      Download the zip file below and extract it to your Foundry VTT modules folder.
    assets:
      links:
        - name: "${PACKAGE_NAME}-${CI_COMMIT_TAG}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/${PACKAGE_NAME}-${CI_COMMIT_TAG}.zip"
          filepath: "/${PACKAGE_NAME}-${CI_COMMIT_TAG}.zip"
          link_type: package
        - name: "${PACKAGE_NAME}.zip"
          url: "${CI_PROJECT_URL}/-/jobs/${CI_JOB_ID}/artifacts/file/${PACKAGE_NAME}.zip"
          filepath: "/${PACKAGE_NAME}.zip"
          link_type: package
  rules:
    # Only run on version tags (e.g., v1.0.0, 1.0.0)
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/

# Optional: Upload zip to package registry for permanent storage
upload-package:
  stage: release
  image: curlimages/curl:latest
  needs:
    - job: build
      artifacts: true
  script:
    - VERSION=$(cat module.json | grep '"version"' | sed 's/.*"version".*"\([^"]*\)".*/\1/')
    - echo "Uploading version $VERSION to package registry"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file ${PACKAGE_NAME}-${VERSION}.zip \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${PACKAGE_NAME}-${VERSION}.zip"
    - |
      curl --header "JOB-TOKEN: ${CI_JOB_TOKEN}" \
           --upload-file ${PACKAGE_NAME}.zip \
           "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PACKAGE_NAME}/${VERSION}/${PACKAGE_NAME}.zip"
  rules:
    # Only run on version tags
    - if: $CI_COMMIT_TAG =~ /^v?\d+\.\d+\.\d+$/